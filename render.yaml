# Render Blueprint — Hidden Chain
# =================================
# 用法：Render Dashboard → New → Blueprint → 选中本仓库，Render 会读取本文件。
# 完整步骤、需要人工准备的凭据、以及**上线前必须解决的阻塞项**见 DEPLOY_RENDER.md。
#
# ⚠️ 未解决 DEPLOY_RENDER.md 的 P0 阻塞项（接口无任何鉴权）之前，请勿部署到公网：
#    /api/dashboard/<user_id> 可被任意枚举，等同于公开他人健康数据。
#
# 注：较老的 Render 文档里这个字段叫 `env: python`，现行 spec 是 `runtime:`，两者等价。

services:
  - type: web
    name: hidden-chain
    runtime: python
    # free 计划**不能挂持久磁盘**，SQLite 会随每次部署/休眠被清空；
    # 需要留存打卡历史就得用 starter 及以上（付费）。
    plan: starter
    region: singapore
    branch: main
    # 手动部署：避免每次 push main 就把线上实例换掉（健康数据服务不做静默滚更）。
    autoDeploy: false

    buildCommand: pip install -r requirements.txt
    # --workers 1：SQLite 单写者，多 worker 并发写会 "database is locked"。
    #              要扩容必须先把存储换成 Postgres（见 DEPLOY_RENDER.md 阻塞项 P1）。
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        # 引擎用了 PEP 604 (`X | None`)，最低 3.10；CI 矩阵测到 3.12。
        value: "3.12.6"
      - key: HC_DATA_DIR
        # 必须与下面 disk.mountPath 一致，否则库会落在临时文件系统上被清掉。
        value: /var/data
      - key: HC_DEBUG
        # 绝不能在公网开 Werkzeug 调试器（页面内可执行任意代码）。
        value: "0"

    disk:
      name: hidden-chain-data
      mountPath: /var/data
      sizeGB: 1
