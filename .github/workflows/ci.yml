name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Quality gate — syntax + smoke
    runs-on: ubuntu-latest
    # Run all matrix versions even if one fails, so we see the full picture.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cheap syntax gate: compile every engine + test module.
      # Catches version-incompatible syntax (engine requires >=3.10).
      - name: Syntax check (py_compile)
        run: python -m py_compile src/*.py tests/*.py

      # Real gate: import all engine modules + verify the ScoreLevel contract.
      # Exit code 0 = pass; any failure blocks the merge/push path.
      - name: Smoke test (engine contract)
        run: python tests/smoke_test.py

  type-check:
    name: Type check (mypy) — gate 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy
      # Reads [tool.mypy] from pyproject.toml at repo root.
      # Blocks the merge/push path on any type error in src/.
      - name: Run mypy on engine src/
        run: mypy src/

  unit-tests:
    name: Unit tests (pytest) — gate 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      # Behavioral regression suite. The founder N=1 case (research/009) is
      # the validation oracle. Any score-threshold or autonomic-age drift
      # fails the build instead of shipping silently.
      - name: Run pytest suite
        run: pytest tests/test_engine.py -q
