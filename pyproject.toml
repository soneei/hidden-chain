[tool.mypy]
# Engine targets Python >=3.10 (uses PEP 604 `X | None` syntax).
python_version = "3.10"
# data_loader.py imports pandas only for an optional legacy Excel path;
# we don't vendor pandas-stubs, so ignore that one missing stub.
ignore_missing_imports = true

[tool.coverage.run]
# Coverage gate applies to the auditable science core only.
# data_loader.py / device_adapters.py are pandas/device CSV I/O adapters
# (plumbing) — excluded to keep the gate meaningful on the algorithm, not the
# CSV parsing.
source = ["src"]
omit = [
    "src/data_loader.py",
    "src/device_adapters.py",
]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
# Only collect test_*.py; smoke_test.py is run directly by the CI smoke gate
# step (it calls sys.exit), not via pytest.
python_files = ["test_*.py"]
testpaths = ["tests"]
